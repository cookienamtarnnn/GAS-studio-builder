<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Callback</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }
    .error {
      color: #ef4444;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="message" id="message">Completing authentication...</div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const errorDescription = params.get('error_description');

      const messageEl = document.getElementById('message');

      if (error) {
        messageEl.textContent = `Authentication failed: ${errorDescription || error}`;
        messageEl.className = 'message error';
        setTimeout(() => window.close(), 3000);
        return;
      }

      if (!code || !state) {
        messageEl.textContent = 'Invalid callback - missing code or state';
        messageEl.className = 'message error';
        setTimeout(() => window.close(), 3000);
        return;
      }

      // Send code and state to parent window
      if (window.opener) {
        window.opener.postMessage({
          type: 'oauth-callback',
          code,
          state
        }, window.location.origin);

        messageEl.textContent = 'Authentication successful! Closing...';
        setTimeout(() => window.close(), 1000);
      } else {
        messageEl.textContent = 'Could not communicate with parent window';
        messageEl.className = 'message error';
      }
    })();
  </script>
</body>
</html>
